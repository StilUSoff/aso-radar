<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASO Radar</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ASO&nbsp;Radar</div>
  <input id="globalSearch" type="search" placeholder="Найти запрос во всех гео…" aria-label="Поиск запроса по всем рынкам">
  <div class="spacer"></div>
  <span id="scanStatus" class="muted"></span>
  <button id="scanAllBtn" class="primary">Сканировать все рынки</button>
</header>

<main>
  <section id="searchBox" class="box hidden">
    <div class="section-title">Запрос по гео</div>
    <div id="searchResults"></div>
  </section>

  <div class="section-title">Market snapshot — топ поисковых запросов по рынкам</div>
  <section class="box">
    <div id="tiles" class="tiles"></div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>свежие данные</span>
      <span><i style="background:var(--warn)"></i>сильное обновление топа (≥10 новых в топ‑100)</span>
      <span><i style="background:var(--bad)"></i>данные устарели</span>
      <span><i style="background:var(--faint)"></i>ещё не сканировался</span>
    </div>
  </section>

  <div class="section-title">Рынки</div>
  <div id="markets"></div>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
